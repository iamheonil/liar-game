# 정적 파일과 API 를 한 출처로 묶어 주는 프런트 서버.
# 브라우저 입장에서는 모든 것이 같은 도메인에서 오므로 CORS 도, 쿠키 문제도 생기지 않음.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 프록시 뒤 실제 클라이언트 정보 유지
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 파일 이름에 해시가 붙어 있어 내용이 바뀌면 이름도 바뀜. 그래서 영구 캐시가 안전함
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:8080;
    }

    # WebSocket 은 연결을 유지해야 하므로 업그레이드 헤더와 긴 타임아웃이 필요함.
    # 게임 한 판이 길어질 수 있어 읽기 타임아웃을 넉넉히 둠.
    location /ws {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 새로고침해도 라우팅이 깨지지 않도록 모든 경로를 앱으로 넘김
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 은 항상 최신을 받아야 새 배포가 즉시 반영됨
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
